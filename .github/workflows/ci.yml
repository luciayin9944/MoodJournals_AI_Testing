name: Deterministic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  backend-and-ai-tests:
    name: Backend and Deterministic AI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-test.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install -r server/requirements-test.txt

      - name: Run backend and Phase 3 tests
        run: |
          python -m pytest server/tests \
            --junitxml=test-results/backend-tests.xml

      - name: Run Phase 4 evaluation unit tests
        run: |
          python -m pytest evals/tests \
            --junitxml=test-results/evaluation-tests.xml

      - name: Run offline deterministic AI evaluation
        run: |
          python -m evals.run_evals \
            --mode fixtures \
            --deterministic-only \
            --report test-results/deterministic-evaluation.json

      - name: Upload backend and AI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ai-test-reports
          path: test-results/
          if-no-files-found: warn
          retention-days: 14


  frontend-quality:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: client/dist/
          if-no-files-found: error
          retention-days: 14


  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      E2E_DATABASE_URI: sqlite:////tmp/moodjournal_e2e_test.db
      JWT_SECRET_KEY: github-actions-e2e-test-secret
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-test.txt

      - name: Create backend virtual environment
        run: python -m venv server/venv

      - name: Install backend dependencies
        run: |
          server/venv/bin/python -m pip install --upgrade pip
          server/venv/bin/python -m pip install -r server/requirements.txt
          server/venv/bin/python -m pip install -r server/requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: client
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          if-no-files-found: ignore
          retention-days: 14