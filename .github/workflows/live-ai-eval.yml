name: Live AI Evaluation

on:
  workflow_dispatch:
    inputs:
      generation_model:
        description: Model used to generate the AI response
        required: true
        default: gpt-4o-mini
        type: string

      judge_model:
        description: Model used to evaluate the AI response
        required: true
        default: gpt-4o-mini
        type: string

permissions:
  contents: read

jobs:
  live-ai-smoke-evaluation:
    name: Live AI Smoke Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-test.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install -r server/requirements-test.txt

      - name: Verify OpenAI API key is configured
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY GitHub Secret is not configured."
            exit 1
          fi

      - name: Run live AI smoke evaluation
        run: |
          python -m evals.run_evals \
            --mode live \
            --dataset evals/fixtures/live_smoke_dataset.json \
            --generation-model "${{ inputs.generation_model }}" \
            --judge-model "${{ inputs.judge_model }}" \
            --report evals/reports/live-smoke-report.json

      - name: Upload live evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-ai-evaluation-report
          path: evals/reports/live-smoke-report.json
          if-no-files-found: warn
          retention-days: 30
